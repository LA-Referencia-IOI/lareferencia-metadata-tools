[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lareferencia-metadata-tools"
version = "5.0.0rc4"
description = "LA Referencia metadata enrichment, rights and embedding workflows"
requires-python = ">=3.12"
license = {file = "LICENSE"}

[project.optional-dependencies]
bibliographic = ["fasttext==0.9.3", "numpy==1.26.4"]
inference = ["numpy>=1.26,<3", "huggingface-hub", "torch==2.11.0", "torchvision==0.26.0", "sentence-transformers==6.3.0", "transformers==5.23.0"]

[project.scripts]
count-export-licenses = "lareferencia_metadata_tools.count_export_licenses:main"
normalize-rights = "lareferencia_metadata_tools.normalize_rights:main"
normalize-cc-licenses = "lareferencia_metadata_tools.normalize_cc_licenses:main"
classify-export-licenses = "lareferencia_metadata_tools.classify_export_licenses:main"
build-rights-enrichment = "lareferencia_metadata_tools.build_rights_enrichment:main"
run-rights-pipeline = "lareferencia_metadata_tools.run_rights_pipeline:main"
enrichments = "lareferencia_metadata_tools.enrichments:main"
prepare-embedding-metadata = "lareferencia_embedding_metadata.prepare:main"
postprocess-embedding-metadata = "lareferencia_embedding_metadata.postprocess:main"
train-embedding-metadata = "lareferencia_embedding_metadata.train:main"
build-embedding-inputs = "lareferencia_embedding_metadata.examples.build_inputs:main"
compute-metadata-embeddings = "lareferencia_metadata_tools.compute_metadata_embeddings:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enrichment_package = ["schema.sql"]
